//	==============================================================================
//	H4  -  designed with engine_designer/ (fictional, unless you renamed it)
//
//	Propellant: LOX/RP-1   Mixture ratio: 2.36
//	Cycle: tap-off   Chamber Pressure: 14.00 MPa
//	Expansion ratio: 18.0   Nozzle: Bell (86% length, theta_n 33.2 / theta_e 7.3 deg)
//	Injector: Impinging (like-on-like / unlike doublet)   Ignition: TEA-TEB pyrophoric slug
//	Contraction ratio: 2.50   L*: 2.00 m
//	Chamber material: Inconel 718 Nickel Superalloy (margin 1.41x @ Tc 3612 K)
//	Nozzle-extension material (past eps 8): Ablative Phenolic-Silica (margin 3.31x @ local T 1725 K)
//
//	Thrust (Vac): 1582.0 kN   Thrust (Vac, floor): 949.2 kN
//	ISP: 284.0 SL / 306.2 Vac
//	Throttle: 60 - 100%
//	mdot: 526.9 kg/s
// 
//	massMult NOT computed by this tool (v1) - defaults to 1.0 (host part's stock dry mass). Adjust by hand if the design should be heavier/lighter.
//	==============================================================================

@PART[*]:HAS[#engineType[H1]]:NEEDS[RealismOverhaul&RealFuels]:AFTER[RealismOverhaulEngines]
{
	@MODULE[ModuleEngineConfigs]
	{
		CONFIG
		{
			name = H-4-355K
			description = Custom engine designed with engine_designer/. LOX/RP-1 tap-off, Impinging (like-on-like / unlike doublet) injector, TEA-TEB pyrophoric slug ignition, Pc 14.00 MPa, bell (86% length, theta_n 33.2 / theta_e 7.3 deg) nozzle, throttles 60-100%.
			specLevel = concept
			minThrust = 949.22
			maxThrust = 1582.03
			ratedBurnTime = 200
			heatProduction = 100
			massMult = 1.1
			pressureFed = False
			ullage = True
			ignitions = 1
			throttleResponseRate = 0.6	//dual-channel digital closed-loop

			varyIsp = 0.004		//condition-monitored digital controller (estimate)
			varyMixture = 0.001
			residualsThresholdBase = 0.005	//tight cutoff, low trapped propellant

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
			IGNITOR_RESOURCE
			{
				name = TEATEB
				amount = 1
			}

			PROPELLANT
			{
				name = RP-1
				ratio = 0.3738
				DrawGauge = True
			}

			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.6262
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 306.2
				key = 1 284.0
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 4000
				ratedBurnTime = 200
				safeOverburn = true
				ignitionReliabilityStart = 0.970000
				ignitionReliabilityEnd = 0.995000
				cycleReliabilityStart = 0.970000
				cycleReliabilityEnd = 0.995000
				techTransfer = S-3D,S-3:25&H-2-250K,H-1-250K,H-1-205K,H-1-200K,H-1-188K,H-1-165K:50
			}
		}
	}
}
@PART[*]:HAS[#engineType[H1]]:NEEDS[RP-0]:BEFORE[RealismOverhaulEnginesPost]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG[H-4-355K]
		{
			%techRequired = orbitalRocketry1976
			%entryCost = 25000
			%cost = 20
		}
	}
}