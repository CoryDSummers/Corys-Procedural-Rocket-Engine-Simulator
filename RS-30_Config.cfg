//	==============================================================================
//	RS-30  -  designed with engine_designer/ (fictional, unless you renamed it)
//
//	Propellant: LOX/RP-1   Mixture ratio: 2.38
//	Cycle: tap-off   Chamber Pressure: 14.00 MPa
//	Expansion ratio: 20.0   Nozzle: Bell (80% length, theta_n 35.5 / theta_e 11.0 deg)
//	Injector: Unlike triplet (2-on-1)   Ignition: TEA-TEB pyrophoric slug
//	Contraction ratio: 2.80   L*: 1.70 m
//	Chamber material: Inconel 718 Nickel Superalloy (margin 1.54x @ Tc 3618 K)
//	Chamber cooling: regenerative (material-default)   Nozzle cooling: film (explicit)
//	Nozzle-extension material (past eps 6): Inconel 718 Nickel Superalloy (margin 2.25x @ local T 1851 K)
//
//	Thrust (Vac): 1604.2 kN   Thrust (Vac, floor): 994.6 kN
//	ISP: 291.1 SL / 316.5 Vac
//	Throttle: 62 - 100%
//	mdot: 516.9 kg/s
//	Estimated dry mass: 2493.4 kg (chamber/nozzle wall 1921.7 kg + turbopump 488.8 kg + injector plate 82.9 kg - a LOWER BOUND, see physics/mass_model.py: no valves/actuators/mounting structure)
//	Rated / tested burn time: 267 / 3738 s
//
//	Turbopump: dual shaft, 2x velocity compounded 2row turbine, 2-stage fuel pump 18574 rpm / 1-stage ox pump 18127 rpm, Powder-Metallurgy Superalloy (HIP, e.g. MAR-M / Rene PM)
//	  derived efficiency: fuel pump 0.738, ox pump 0.775, turbine 0.630 (overall 0.477); assembly ~0.65x0.61 m, ~489 kg; peak tip speed 171 m/s (feasible)
//
//	Cycle detail: chamber tap-off gas film-cooled to ~1150 K, bleed 3.6%, dump Isp fraction 0.80
//
//	Output mode: new standalone part 'RS-30' borrowing the E1 model
//	  model rescaleFactor x0.5834 (design length 2.13 m, uniform scale)
//	origMass = 2.4934 t - part mass pinned (TR341 convention); CONFIG massMult = 1.0 and rescaleFactor is visual only.
//	==============================================================================

+PART[*]:HAS[#engineType[E1]]:NEEDS[RealismOverhaul&RealFuels]:BEFORE[RealismOverhaulEngines]
{
	@name = RS-30
	%engineType = RS-30
	%category = Engine
	%title = Rocketdyne
	%manufacturer = Fictional
	%description = Custom engine designed with engine_designer/. LOX/RP-1 tap-off, Pc 14.0 MPa. Borrows the E1 model.
	@tags ^= :$: engine-designer custom fictional
	@rescaleFactor *= 0.5834
	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}
}


//	------------------------------------------------------------------------------
//	Engine definition for the new part (its own #engineType[RS-30]).
//	origMass pins the part mass in tonnes (TR341 convention).
//	------------------------------------------------------------------------------
@PART[RS-30]:NEEDS[RealismOverhaul&RealFuels]:AFTER[RealismOverhaulEngines]
{
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = RS-30
		origMass = 2.4934
		CONFIG
		{
			name = RS-30
			description = Custom engine designed with engine_designer/. LOX/RP-1 tap-off, Unlike triplet (2-on-1) injector, TEA-TEB pyrophoric slug ignition, Pc 14.00 MPa, bell (80% length, theta_n 35.5 / theta_e 11.0 deg) nozzle, throttles 62-100%.
			specLevel = concept
			minThrust = 994.61
			maxThrust = 1604.21
			ratedBurnTime = 267
			heatProduction = 100
			massMult = 1.0
			cost = 240.0
			throttleResponseRate = 0.6
			varyIsp = 0.008
			varyMixture = 0.004
			residualsThresholdBase = 0.008
			pressureFed = False
			ullage = True
			ignitions = 2

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
			IGNITOR_RESOURCE
			{
				name = TEATEB
				amount = 1
			}

			PROPELLANT
			{
				name = RP-1
				ratio = 0.3718
				DrawGauge = True
			}

			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.6282
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 316.5
				key = 1 291.1
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 3738
				ratedBurnTime = 267
				safeOverburn = true
				ignitionReliabilityStart = 0.972170
				ignitionReliabilityEnd = 0.995826
				cycleReliabilityStart = 0.972170
				cycleReliabilityEnd = 0.995826
			}
		}
	}
}


//	------------------------------------------------------------------------------
//	RP-1 career tech-tree gating.  No-ops without RP-1 installed (:NEEDS[RP-0]).
//	entryCost / cost estimated by the design tool (physics/cost_model.py) - tune to taste.
//	------------------------------------------------------------------------------
@PART[RS-30]:NEEDS[RP-0]:BEFORE[RealismOverhaulEnginesPost]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG[RS-30]
		{
			%techRequired = orbitalRocketry1976
			%entryCost = 55000.0
			%cost = 240.0
		}
	}
}
