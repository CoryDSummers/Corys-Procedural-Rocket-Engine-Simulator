//	==================================================================================
//	TR-341  —  TRW Lunar Landing Engine (LLE)   (fictional)
//
//	Manufacturer: TRW
//
//	STANDALONE add-on patch, independent of RealismOverhaul / RP-1.
//
//	A scaled-up, deep-throttling descendant of the Thiokol TD-339 Surveyor vernier,
//	in the TRW pintle-engine line (LMDE / TR-201 / TR-30x). Storable hypergolic
//	MON10 / MMH, pressure-fed, ullage-free (propellant-management-device tanks),
//	unlimited hypergolic restarts, gimballed. Flown in CLUSTERS OF FOUR: four TR-341s
//	perform the entire powered descent of a ~3.5 t robotic lunar lander, from the
//	orbital braking burn through terminal descent and touchdown.
//
//	=================================================================================
//	Design premise
//
//	 * Architecture straight from the TD-339: coaxial pintle element, fuel-film-cooled
//	   ablative throat, helium-pressurised bipropellant feed, surface-tension /
//	   bladder tanks so no ullage settling is ever required.
//	 * Thrust scaled ~9x (0.46 -> 4.3 kN) for the lander-main-engine role; chamber
//	   pressure raised 1.72 -> ~2.2 MPa for the larger pintle; expansion ratio ~80
//	   (space nozzle - unusable in a sea-level atmosphere).
//	 * Pintle throttling widened from the TD-339's 3:1 to 5:1 (100 - 20 %). A clean
//	   5:1 pintle avoids the deep-throttle throat-erosion band that forces the LMDE
//	   to skip 65 - 94 %, so no throttle lock-out is modelled here.
//	 * MON10 (10 % NO in N2O4) for freezing-point margin through the trans-lunar
//	   cruise and lunar-day/night thermal swings.
//	 * Four gimballed units give full 3-axis + roll control and one-engine-out
//	   tolerance during descent.
//
//	=================================================================================
//	TR-341     [F]  single thruster; fly four
//
//	Dry Mass: ~18 kg           (per thruster; RO-style over-mass for valves/actuators)
//	Thrust (Vac): 4.30 kN      per thruster   (17.2 kN for a cluster of four)
//	Thrust (SL):  n/a          (eps ~80, separated below ~0.9 atm)
//	ISP: 310 Vac               (nominal ~1 s below 0.9 atm)
//	Chamber Pressure: ~2.2 MPa
//	Propellant: MON10 / MMH
//	Prop Ratio: ~1.5 (O/F, mass)
//	Throttle: 20 - 100 %       (5:1 pintle)
//	Nozzle Ratio: ~80
//	Ignitions: unlimited       (hypergolic, pressure-fed, no ullage needed)
//	Gimbal: 6                  per thruster
//
//	=================================================================================
//	Sizing check - lander: 3500 kg at powered-descent initiation, lunar g = 1.625 m/s2
//
//	   Cluster thrust        4 x 4.30 = 17.2 kN
//	   T/W (lunar) at 3500 kg   17200 / (3500 x 1.625) = 3.02   (hover margin)
//	   Descent dV (orbit -> touchdown, incl. losses/hover)   ~2000 m/s
//	   Propellant (Isp 310)   3500 x (1 - e^-(2000/(310x9.807))) ~ 1690 kg MON10/MMH
//	   Landed mass            ~1810 kg
//	   At landed mass: 4 x minThrust (4 x 0.86 = 3.44 kN) still exceeds hover
//	                   (1810 x 1.625 = 2.94 kN) -> controllable powered descent with
//	                   no engine-out; drop to 2 running engines for fine terminal work.
//
//	=================================================================================
//	Derivation: architecture and propellants from RealismOverhaul Engine_Configs/
//	TD339_Config.cfg (Thiokol TD-339); throttle / reliability shape informed by
//	LMDE_Config.cfg (TRW LMDE). [F] = fictional; this engine never existed.
//	==================================================================================


//	----------------------------------------------------------------------------------
//	1) MODEL BINDING  —  YOU MUST EDIT THIS or nothing loads (that is not an error).
//
//	Put a real part name from your install in place of TR341_HOST_PART (dots -> '_').
//	Pick a small gimballed hypergolic lander / vernier engine model. Good candidates:
//	  * Coatl Aerospace (ProbesPlus / GroundOps) lander engines  - closest visual match,
//	    and Coatl is already a "used by" mod for the real TD-339.
//	  * a Bluedog Design Bureau Apollo LM descent engine or lunar-probe vernier.
//	  * a ROEngines generic hypergolic engine part.
//	Find the internal name via GameData/<mod>/**/*.cfg  ->  `name = ...`, or the
//	in-game Alt+F12 part database.
//
//	If the chosen part already has an #engineType, this overrides it for that part
//	only - make sure you want to repurpose it.
//
//	FALLBACK (no binding): uncomment the LMDE block further down to add TR-341 as a
//	selectable config on the existing LMDE part instead (guaranteed to load; the
//	model is an over-scale lunar descent engine but thematically a pintle lander).
//	----------------------------------------------------------------------------------

@PART[TR341_HOST_PART]:NEEDS[RealismOverhaul&RealFuels]:BEFORE[RealismOverhaulEngines]
{
	%engineType = TR341
}

//@PART[*]:HAS[#engineType[LMDE]]:NEEDS[RealismOverhaul&RealFuels]:BEFORE[RealismOverhaulEngines]
//{
//	%engineType = TR341
//}


//	----------------------------------------------------------------------------------
//	2) ENGINE DEFINITION  —  applied to whatever part carries #engineType[TR341].
//	----------------------------------------------------------------------------------

@PART[*]:HAS[#engineType[TR341]]:NEEDS[RealismOverhaul&RealFuels]:AFTER[RealismOverhaulEngines]
{
	%category = Engine
	%title = TR-341
	%manufacturer = TRW
	%description = Fictional TRW lunar landing engine, a scaled-up deep-throttling descendant of the Thiokol TD-339 Surveyor vernier. Storable MON10/MMH, pressure-fed, ullage-free, unlimited restarts, coaxial pintle injector throttling 100-20%. Flown in clusters of four: four of these fly the complete powered descent of a ~3.5 t robotic lunar lander.

	@tags ^= :$: USA trw tr-341 td-339 liquid pressure-fed lander descent hypergolic mmh mon10 pintle throttle vernier fictional

	%specLevel = concept

	@MODULE[ModuleEngines*]
	{
		%EngineType = LiquidFuel
	}

	@MODULE[ModuleGimbal]
	{
		%gimbalRange = 6.0
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 16
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = TR-341
		origMass = 0.018	//per thruster; RO-style over-mass for bipropellant valves, gimbal actuators, mount

		CONFIG
		{
			name = TR-341
			specLevel = concept
			minThrust = 0.86	//5:1 pintle
			maxThrust = 4.30
			heatProduction = 100
			massMult = 1.0
			ullage = False
			pressureFed = True

			varyMixture = 0.010
			residualsThresholdBase = 0.006	//pressure-fed with a propellant-management device

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.05
			}

			PROPELLANT
			{
				name = MMH
				ratio = 0.5224
				DrawGauge = True
			}

			PROPELLANT
			{
				name = MON10
				ratio = 0.4776
				DrawGauge = False
			}

			PROPELLANT
			{
				name = Helium
				ratio = 25.8
				ignoreForIsp = True
			}

			atmosphereCurve
			{
				key = 0 310
				key = 0.9 1
			}

			//No flight history - fictional. Reliability seeded from the TD-339 (a
			//simple, flight-proven pressure-fed hypergolic vernier), nudged up for
			//mature 1970s tooling. Ablative throat -> linear thrust-vs-life.
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedBurnTime = 600
				ratedContinuousBurnTime = 500
				safeOverburn = true

				thrustModifier
				{
					key = 0.00 0.00 1 1
					key = 1.00 1.00 1 1
				}

				ignitionReliabilityStart = 0.980000
				ignitionReliabilityEnd = 0.996000
				cycleReliabilityStart = 0.975000
				cycleReliabilityEnd = 0.995000
				techTransfer = TD-339:40&LMDE-H:20
			}
		}
	}
}


//	----------------------------------------------------------------------------------
//	3) RP-1 career tech-tree gating.  No-ops without RP-1 (:NEEDS[RP-0]).
//	Node: advancedUncrewedLanding ("1972-1980") - RP-1's uncrewed-lander node.
//	entryCost / cost are rough estimates; tune to taste.
//	----------------------------------------------------------------------------------

@PART[*]:HAS[#engineType[TR341]]:NEEDS[RP-0]:BEFORE[RealismOverhaulEnginesPost]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG[TR-341]
		{
			%techRequired = advancedUncrewedLanding
			%entryCost = 5000
			%cost = 5
		}
	}
}
