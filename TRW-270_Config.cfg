//	==============================================================================
//	TRW-270  -  designed with engine_designer/ (fictional, unless you renamed it)
//
//	Propellant: Aerozine-50/NTO   Mixture ratio: 2.02
//	Cycle: pressure-fed   Chamber Pressure: 0.60 MPa
//	Expansion ratio: 50.0   Nozzle: Bell (70% length, theta_n 40.2 / theta_e 10.8 deg)
//	Injector: Pintle   Ignition: Hypergolic self-ignition
//	Contraction ratio: 3.57   L*: 1.00 m
//	Chamber material: Stainless Steel (304/316) (margin 1.63x @ Tc 3234 K)
//	Chamber cooling: film (material-default)   Nozzle cooling: ablative (material-default)
//	Nozzle-extension material (past eps 19): Ablative Phenolic-Silica (margin 4.44x @ local T 1286 K)
//
//	Thrust (Vac): 12.0 kN   Thrust (Vac, floor): 1.2 kN
//	ISP: 1.0 SL / 303.6 Vac
//	Throttle: 10 - 100%
//	mdot: 4.0 kg/s
//	Estimated dry mass: 19.9 kg (chamber/nozzle wall 18.2 kg + turbopump -0.0 kg + injector plate 1.7 kg - a LOWER BOUND, see physics/mass_model.py: no valves/actuators/mounting structure)
//	Rated / tested burn time: 283 / 4951 s
//
//	WARNINGS from the design tool (review before using in a career save):
//	  - Nozzle is separated at sea level even at 100% throttle (Pe/Pa=0.009) - this is a vacuum/high-altitude nozzle, not suited to a sea-level-igniting stage. sl Isp/thrust are nominal placeholders, not physical.
//
//	Output mode: new standalone part 'TRW-270' borrowing the LMDE model
//	  model rescaleFactor x0.7356 (design length 1.24 m, uniform scale)
//	origMass = 0.0199 t - part mass pinned (TR341 convention); CONFIG massMult = 1.0 and rescaleFactor is visual only.
//	==============================================================================

+PART[*]:HAS[#engineType[LMDE]]:NEEDS[RealismOverhaul&RealFuels]:BEFORE[RealismOverhaulEngines]
{
	@name = TRW-270
	%engineType = TRW-270
	%category = Engine
	%title = TRW
	%manufacturer = Fictional
	%description = Custom engine designed with engine_designer/. Aerozine-50/NTO pressure-fed, Pc 0.6 MPa. Borrows the LMDE model.
	@tags ^= :$: engine-designer custom fictional
	@rescaleFactor *= 0.7356
	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}
}


//	------------------------------------------------------------------------------
//	Engine definition for the new part (its own #engineType[TRW-270]).
//	origMass pins the part mass in tonnes (TR341 convention).
//	------------------------------------------------------------------------------
@PART[TRW-270]:NEEDS[RealismOverhaul&RealFuels]:AFTER[RealismOverhaulEngines]
{
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = TRW-270
		origMass = 0.0199
		CONFIG
		{
			name = TRW-270
			description = Custom engine designed with engine_designer/. Aerozine-50/NTO pressure-fed, Pintle injector, Hypergolic self-ignition ignition, Pc 0.60 MPa, bell (70% length, theta_n 40.2 / theta_e 10.8 deg) nozzle, throttles 10-100%.
			specLevel = concept
			minThrust = 1.20
			maxThrust = 12.00
			ratedBurnTime = 283
			heatProduction = 100
			massMult = 1.0
			cost = 1.0
			throttleResponseRate = 0.6
			varyIsp = 0.008
			varyMixture = 0.004
			residualsThresholdBase = 0.008
			pressureFed = True
			ullage = True
			ignitions = 30

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.05
			}

			PROPELLANT
			{
				name = Aerozine50
				ratio = 0.4415
				DrawGauge = True
			}

			PROPELLANT
			{
				name = NTO
				ratio = 0.5585
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 303.6
				key = 1 1.0
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 4951
				ratedBurnTime = 283
				safeOverburn = true
				ignitionReliabilityStart = 0.975350
				ignitionReliabilityEnd = 0.996302
				cycleReliabilityStart = 0.975350
				cycleReliabilityEnd = 0.996302
			}
		}
	}
}


//	------------------------------------------------------------------------------
//	RP-1 career tech-tree gating.  No-ops without RP-1 installed (:NEEDS[RP-0]).
//	entryCost / cost estimated by the design tool (physics/cost_model.py) - tune to taste.
//	------------------------------------------------------------------------------
@PART[TRW-270]:NEEDS[RP-0]:BEFORE[RealismOverhaulEnginesPost]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG[TRW-270]
		{
			%techRequired = improvedLandingEngines
			%entryCost = 414.0
			%cost = 1.0
		}
	}
}
