//	==================================================================================
//	H-4-250K  —  clean-sheet ~1978 LOX/RP-1 core-sustainer, H-x family   (fictional)
//
//	Manufacturer: Rocketdyne (fictional)
//
//	STANDALONE add-on patch. NOT part of RealismOverhaul — own folder so an RO update
//	will not overwrite it. Appends one CONFIG (+ SUBCONFIG 20AR) to the
//	ModuleEngineConfigs that RO's H1_Config.cfg builds on the H-1 part, running
//	:AFTER[RealismOverhaulEngines] so that module already exists (same mechanism as
//	H3-250K_Config.cfg).
//
//	Shares the host H-1 3D model. The eps~14 / eps~20 bells are therefore NOT visually
//	represented — renders as the stubby H-1 nozzle, the same compromise RO's own file
//	makes for the eps 12 RS-27A.
//
//	=================================================================================
//	NUMBERS ARE COMPUTED, NOT HAND-WAVED. Every figure in this file (Isp, thrust,
//	chamber/throat sizing, turbopump power, GG flow fraction, throttle-separation
//	onset) is the direct printed output of a small Python physics test bed at
//	/home/cory/ksp_config/sim/ (isentropic.py + engine_physics.py + h4_report.py).
//	Re-run `python3 sim/h4_report.py` to reproduce every number below. That script:
//	  - solves the exact isentropic area-Mach relation (root-find, not hand iteration)
//	    for Pe/Pc and the thrust coefficient at eps 14 and eps 20,
//	  - FIRST spot-checks the same model against the real RealismOverhaul RD-111
//	    (Pc 7.85 MPa, eps 18, MR 2.39) and reproduces its listed 309.5/268 s Isp to
//	    within +0.6%/+0.9% before the H-4 numbers are trusted,
//	  - sizes the shared powerhead mass flow off the eps-20 nozzle's vacuum thrust
//	    (target under the 1600 kN ceiling), then derives the eps-14 nozzle's
//	    performance from that SAME flow (one powerhead, two bells — not two engines),
//	  - mass-averages the main-chamber Isp with the ~3.5% gas-generator-dump flow
//	    (assumed to deliver ~55% of chamber Isp, dumped into the skirt) to get the
//	    engine-level Isp used below — this is why the .cfg numbers are a few seconds
//	    lower than the raw chamber-only Isp,
//	  - sweeps sea-level throttle 50-100% and finds where each nozzle's exit pressure
//	    crosses the Summerfield separation threshold (Pe < 0.4 Pa).
//	`massMult`, TESTFLIGHT reliability, and RP-1 entryCost/cost are NOT computed by the
//	test bed — they are engineering-judgement estimates cross-checked against the H-3
//	files and RO's RS-27A, same as before.
//
//	=================================================================================
//	Design premise: NOT an uprate of an existing powerhead. A clean-sheet ~1978
//	turbomachine and thrust chamber in the H-x thrust class, sharing only the family's
//	LOX/RP-1 propellants, mixture ratio (~2.34) and tank interfaces so it drops into
//	the same stages as the H-3.
//
//	 1. Combustion chamber. Slotted (milled) NARloy-Z copper liner, electroformed
//	    nickel close-out, Pc 8.0 MPa. Throat 36.6 cm dia, chamber 46.4 cm dia, L*
//	    1.0 m -> ~62.5 cm to the throat (test bed: chamber_geometry()). RP-1
//	    regenerative cooling up the nozzle to ~eps 8; radiation/film past that;
//	    gas-generator exhaust dumped into the skirt for film cooling and partial
//	    Isp recovery (F-1A pattern).
//	 2. Platelet main injector. Photo-etched, diffusion-bonded face, nominal
//	    injection dP ~25% of Pc (2.0 MPa) — stiff enough that dP/Pc is still ~0.125
//	    (above the ~0.10 chug threshold) at 50% flow (test bed: throttle_sweep()).
//	    A legacy H-1-class injector (nominal dP/Pc ~0.15) would be at ~0.075 at half
//	    flow — unstable. This purpose-built injector is the enabling piece for deep
//	    throttle.
//	 3. Turbopump. Single-shaft, geared LOX/RP-1, low-NPSH inducers both sides.
//	    ~6.9 MW / ~9300 shp at ~10-11 MPa discharge (test bed: turbopump_power()).
//	    Single-crystal (PWA-1480-class) turbine blades + powder-metallurgy disks let
//	    the fuel-rich gas generator run a 1050 K turbine inlet instead of an H-3-era
//	    900 K, cutting GG flow from 4.05% to 3.47% of total (test bed:
//	    gg_flow_fraction()) — creep-life margin for 200 s firings + long qual, and a
//	    small direct Isp benefit already folded into the numbers below.
//	 4. Engine bell. Two fixed-eps nozzles on one powerhead: eps~14 (base CONFIG,
//	    pad-attached at 68-100% throttle at sea level) and eps~20 (SUBCONFIG 20AR,
//	    high-altitude sustainer — per the test bed's stricter Summerfield check it is
//	    separated at sea level across the ENTIRE throttle range, i.e. eps 20 is a
//	    vacuum/high-altitude nozzle full stop, not just "mildly over-expanded").
//	 5. Deep throttle to 50% (2:1). GG flow -> pump speed -> Pc and mdot fall
//	    together. Because a RealFuels SUBCONFIG cannot carry its own
//	    throttleIspCurve, both nozzles share ONE curve here, tuned to the eps-14
//	    base nozzle's actual 68% separation onset (the nozzle actually meant for
//	    sea-level use). Flying 20AR through dense atmosphere at any throttle setting
//	    is out of its design envelope regardless of what the shared curve says.
//	 6. Dual-channel fail-operational digital controller with condition monitoring.
//	    Encoded as tight scatter: varyIsp 0.004, varyMixture 0.001,
//	    residualsThresholdBase 0.005 (engineering estimate, not test-bed output).
//	 7. HIP-cast manifolds, VPS-lined chamber, EB-welded joints, 5-axis-milled
//	    slots -> lower parts count and cost. Hot section is heavier (higher Pc,
//	    single-crystal wheel); build is lighter. Net massMult ~1.10 base / ~1.16
//	    20AR (estimate, cross-checked against RS-27A's 1.10425 and the H-3's
//	    1.02->1.08 eps step).
//	 8. Long-life EXPENDABLE. Rated 200 s continuous; qualified to ~8000 s (~40x).
//	    No reuse plumbing, no restart (booster core, ground start only).
//
//	=================================================================================
//	H-4-250K       [F]  eps ~14, pad-attached core sustainer            (sim output)
//
//	Dry Mass: ~1002 kg        (0.911 t H-1 base x massMult 1.10, estimate)
//	Thrust (Vac): 1447.2 kN
//	Thrust (SL):  1299.9 kN    attached at sea level for throttle >= 68%
//	ISP: 271.3 SL / 302.1 Vac
//	Burn Time: 200            rated continuous  (~8000 s qualified)
//	Chamber Pressure: 8.0 MPa
//	Propellant: LOX / RP-1
//	Prop Ratio: ~2.34         (H-x family common)
//	Throttle: 50 - 100%       (2:1; below 68% the bell separates at sea level)
//	Nozzle Ratio: 14
//	Ignitions: 1              TEA-TEB + electric, ground start
//	Gimbal: 10.5              (inherited from the part)
//	---------------------------------------------------------------------------------
//	H-4-250K-20AR  [F]  eps ~20, high-altitude sustainer   (shares the H-1 model)
//
//	Dry Mass: ~1057 kg        (massMult 1.16, estimate)
//	Thrust (Vac): 1476.6 kN
//	Thrust (SL):  1266.1 kN    separated at sea level at ANY throttle — vacuum nozzle
//	ISP: 264.3 SL (nominal only) / 308.2 Vac
//	Nozzle Ratio: 20          (all else as H-4-250K)
//
//	=================================================================================
//	Turbopump / gas generator (informational, not RF fields):
//	  mdot 488.6 kg/s (146.3 fuel / 342.3 ox) ; power ~6.94 MW (~9300 shp) @ ~10-11 MPa
//	  GG flow 3.47% of total @ 1050 K turbine inlet (vs 4.05% at an H-3-era 900 K)
//
//	Sources / derivation:
//	  Baseline part + family lineage: RealismOverhaul Engine_Configs/H1_Config.cfg
//	    (origMass 0.911; RS-27 -> RS-27A eps 8 -> 12 real step, +7 s vac/-9 s sl, used
//	    as a sanity cross-check on the test bed's eps-vs-Isp trend).
//	  Model spot-check target: Engine_Configs/RD111_config.cfg (Pc 7.85 MPa, eps 18,
//	    MR 2.39, kerolox GG, vac Isp 309.5, sl Isp 268 — reproduced by the test bed to
//	    within +0.6%/+0.9% before trusting the H-4 numbers).
//	  GG-to-skirt dump precedent: Engine_Configs/F1_Config.cfg (F-1A, Pc 8.0 MPa GG,
//	    eps 16, turbine exhaust manifolded into the nozzle).
//	  Deep-throttle precedent: NK33_Config.cfg (floor 47-50%), RS68_Config.cfg (floor
//	    50-55%). Separation-throttle-curve idiom: XLR99_Config.cfg RM-3/RM-5
//	    SUBCONFIGs, AR2_Config.cfg, BE-3_Config.cfg (throttleIspCurveAtmStrength).
//	  [F] = fictional; this engine never existed.
//	==================================================================================

@PART[*]:HAS[#engineType[H1]]:NEEDS[RealismOverhaul&RealFuels]:AFTER[RealismOverhaulEngines]
{
	@MODULE[ModuleEngineConfigs]
	{
		CONFIG
		{
			name = H-4-250K
			description = Fictional clean-sheet ~1978 LOX/RP-1 core sustainer in the H-x family. Not an uprate: a new ~8 MPa gas-generator turbomachine (single-crystal turbine, powder-metallurgy disks), platelet main injector, slotted NARloy-Z chamber, turbine exhaust dumped through the nozzle skirt, dual-channel digital controller. Deep-throttles 100-50%, though the eps~14 bell separates below 68% throttle at sea level. eps~14 pad-attached nozzle; subconfig 20AR fits an eps~20 high-altitude bell that is separated at sea level at any throttle. Long-life expendable, rated 200 s. Shares the H-1 model, so the bell is not visually represented. Numbers computed by /home/cory/ksp_config/sim/h4_report.py.
			specLevel = concept
			minThrust = 723.6
			maxThrust = 1447.2
			ratedBurnTime = 200
			heatProduction = 100
			massMult = 1.10	//0.911 t H-1 base -> ~1002 kg (estimate; cf. RS-27A 1.10425)
			throttleResponseRate = 0.6	//dual-channel digital closed-loop

			varyIsp = 0.004		//condition-monitored digital controller (estimate)
			varyMixture = 0.001
			residualsThresholdBase = 0.005	//tight cutoff, low trapped propellant

			ullage = True
			pressureFed = False
			ignitions = 1

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}

			IGNITOR_RESOURCE
			{
				name = TEATEB
				amount = 1
			}

			PROPELLANT
			{
				name = RP-1
				ratio = 0.3880
				DrawGauge = True
			}

			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.6120
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 302.1
				key = 1 271.3
			}

			//eps~14 bell: sim/h4_report.py's throttle sweep finds sea-level separation
			//onset at 68% throttle (Pe/Pa crosses 0.4 there). Curve knees follow the
			//sweep's Pe/Pa progression: flat-separated at/below 66%, ramping to clean
			//by 100%. Shared with SUBCONFIG 20AR (RF SUBCONFIGs can't override this) —
			//see design-premise note 5 above.
			useThrottleIspCurve = true
			throttleIspCurve
			{
				key = 0.00 0.001 0 0
				key = 0.66 0.001 0 0	//separated at SL for all throttle <= 66% (sweep table)
				key = 0.68 0.05  0 0	//separation onset (Pe/Pa crosses 0.4 here)
				key = 0.80 0.55  0 0
				key = 0.90 0.85  0 0
				key = 1.00 1.00  0 0
			}
			throttleIspCurveAtmStrength
			{
				key = 0.0 0.02
				key = 1.0 1.0
			}

			SUBCONFIG
			{
				name = 20AR
				description = H-4-250K with an extended eps~20 bell for the high-altitude sustain phase under solid-booster augmentation. Higher vacuum Isp; per the design test bed this bell is separated at sea level at ANY throttle setting (Pe/Pa 0.375 even at 100%) — a vacuum nozzle, not merely over-expanded. Shares the H-1 model, so the longer bell is not visually represented.
				minThrust = 738.3
				maxThrust = 1476.6
				massMult = 1.16	//~1057 kg (estimate; +eps 14->20 bell mass, cf. H-3's 1.02->1.08 step)
				costOffset = 40
				atmosphereCurve
				{
					key = 0 308.2
					key = 1 264.3
				}
			}

			//Clean-sheet concept, no flight history. Reliability seeded from the H-x
			//gas-generator family and nudged toward the RS-27A band for a mature,
			//condition-monitored 1978 build. Regen chamber -> exponential thrustModifier
			//(improves with accumulated test time). Estimates, not test-bed output.
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 8000	//~40x the 200 s rating
				ratedBurnTime = 200
				safeOverburn = true
				overburnPenalty = 1.3

				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}

				ignitionReliabilityStart = 0.980000
				ignitionReliabilityEnd = 0.997500
				cycleReliabilityStart = 0.980000
				cycleReliabilityEnd = 0.997500
				techTransfer = S-3D,S-3:25&H-3-250K,H-2-250K,H-1-250K,H-1-205K,H-1-200K,H-1-188K,H-1-165K:50
			}
		}
	}
}


//	----------------------------------------------------------------------------------
//	RP-1 career tech-tree gating.  No-ops without RP-1 installed (:NEEDS[RP-0]).
//	Same idiom as RP-1's GameData/RP-1/Tree/TREE-Engines.cfg and the H-3 files.
//	Node: orbitalRocketry1976 ("1976-1980") - sits with the real F-1A / H-1-250K.
//	entryCost / cost are estimates for a ~1.5 MN kerolox engine; tune to taste.
//	----------------------------------------------------------------------------------
@PART[*]:HAS[#engineType[H1]]:NEEDS[RP-0]:BEFORE[RealismOverhaulEnginesPost]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG[H-4-250K]
		{
			%techRequired = orbitalRocketry1976
			%entryCost = 18000
			%cost = 25

			@SUBCONFIG[20AR]
			{
				%cost = 60
			}
		}
	}
}
