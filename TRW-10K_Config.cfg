//	==============================================================================
//	TRW-10K  -  designed with engine_designer/ (fictional, unless you renamed it)
//
//	Propellant: Aerozine-50/NTO   Mixture ratio: 1.94
//	Cycle: pressure-fed   Chamber Pressure: 0.26 MPa
//	Expansion ratio: 40.0   Nozzle: Bell (81% length, theta_n 35.6 / theta_e 5.9 deg)
//	Injector: Pintle   Ignition: Hypergolic self-ignition
//	Contraction ratio: 1.95   L*: 0.95 m
//	Chamber material: Stainless Steel (304/316) (margin 1.25x @ Tc 3209 K)
//	Nozzle-extension material (past eps 9): Niobium C-103 (radiative) (margin 1.99x @ local T 1507 K)
//
//	Thrust (Vac): 10.0 kN   Thrust (Vac, floor): 1.0 kN
//	ISP: 1.0 SL / 301.8 Vac
//	Throttle: 10 - 100%
//	mdot: 3.4 kg/s
//
//	WARNINGS from the design tool (review before using in a career save):
//	  - Nozzle is separated at sea level even at 100% throttle (Pe/Pa=0.005) - this is a vacuum/high-altitude nozzle, not suited to a sea-level-igniting stage. sl Isp/thrust are nominal placeholders, not physical.
//
//	massMult NOT computed by this tool (v1) - defaults to 1.0 (host part's stock dry mass). Adjust by hand if the design should be heavier/lighter.
//	==============================================================================

@PART[*]:HAS[#engineType[EXAMPLE]]:NEEDS[RealismOverhaul&RealFuels]:AFTER[RealismOverhaulEngines]
{
	@MODULE[ModuleEngineConfigs]
	{
		CONFIG
		{
			name = TRW-10K
			description = Custom engine designed with engine_designer/. Aerozine-50/NTO pressure-fed, Pintle injector, Hypergolic self-ignition ignition, Pc 0.26 MPa, bell (81% length, theta_n 35.6 / theta_e 5.9 deg) nozzle, throttles 10-100%.
			specLevel = concept
			minThrust = 1.00
			maxThrust = 10.00
			ratedBurnTime = 200
			heatProduction = 100
			massMult = 1.0
			pressureFed = True
			ullage = False
			
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.05
			}

			PROPELLANT
			{
				name = Aerozine50
				ratio = 0.4512
				DrawGauge = True
			}

			PROPELLANT
			{
				name = NTO
				ratio = 0.5488
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 301.8
				key = 1 1.0
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 4000
				ratedBurnTime = 200
				safeOverburn = true
				ignitionReliabilityStart = 0.970000
				ignitionReliabilityEnd = 0.995000
				cycleReliabilityStart = 0.970000
				cycleReliabilityEnd = 0.995000
			}
		}
	}
}
