//	==================================================================================
//	H-3-250K-V  —  vacuum-optimized H-3 for upper-stage use   (fictional)
//
//	Manufacturer: Rocketdyne (fictional)
//
//	STANDALONE add-on patch, independent of RealismOverhaul.
//
//	This variant is a sibling CONFIG on the SAME H-1 part as the booster variants
//	(H3-250K_Config.cfg), so it always loads wherever a BDB / FASA / KW / Squad /
//	ROEngines H-1 part is installed. Consequence: it shares the H-1 3D model, so the
//	eps~40 vacuum bell is NOT visually represented (it renders as the stubby H-1
//	nozzle) — the same compromise the stock RO file already makes for RS-27A.
//
//	Same H-3 powerhead as the booster variants — channel-wall copper chamber, enlarged
//	low-NPSH turbopump, Pc ~6.2 MPa, FADEC — with:
//	  * an eps ~40 nozzle extension for vacuum Isp (the powerhead could support up to
//	    ~eps 60 / ~330 s if you raise key 0 below),
//	  * FADEC-managed electric spark-torch ignition (no TEA-TEB slug) for 3 restarts,
//	  * the same 100-80% throttle band, useful here for terminal-guidance shaping,
//	  * a reduced gimbal range appropriate to an upper stage.
//
//	Sea-level operation is NOT intended: at eps ~40 the nozzle is heavily
//	over-expanded and separated at 1 atm; the key = 1 Isp figure is nominal only.
//
//	=================================================================================
//	H-3-250K-V     [F]  eps ~40, vacuum upper stage
//
//	Dry Mass: ~1166 kg       (0.911 t H-1 base x massMult 1.28: big vacuum bell + restart kit)
//	Thrust (Vac): 1504 kN
//	Thrust (SL):  n/a         (separated flow)
//	ISP: ~195 SL / 323 Vac    SL figure nominal only
//	Chamber Pressure: ~6.2 MPa
//	Propellant: LOX / RP-1
//	Prop Ratio: ~2.34
//	Throttle: 80 - 100%
//	Nozzle Ratio: ~40
//	Ignitions: 3              electric spark-torch, FADEC-sequenced
//	Gimbal: 6                 (per-CONFIG override of the H-1 part's 10.5)
//
//	Derivation: H-3-250K powerhead (see H3-250K_Config.cfg); eps 16 -> 40 vacuum-Isp
//	step scaled from RealismOverhaul LR87_Config.cfg (eps 15 -> 49 SUBCONFIG data).
//	[F] = fictional.
//	==================================================================================


//	----------------------------------------------------------------------------------
//	1) ENGINE DEFINITION  —  appended to the H-1 part's ModuleEngineConfigs.
//	----------------------------------------------------------------------------------

@PART[*]:HAS[#engineType[H1]]:NEEDS[RealismOverhaul&RealFuels]:AFTER[RealismOverhaulEngines]
{
	@MODULE[ModuleEngineConfigs]
	{
		CONFIG
		{
			name = H-3-250K-V
			description = Vacuum-optimized upper-stage member of the fictional H-3 family. The H-3-250K powerhead (channel-wall copper chamber, enlarged low-NPSH turbopump, ~6.2 MPa, FADEC) fitted with an eps~40 nozzle extension and FADEC-sequenced electric spark-torch ignition for three restarts. Throttles 100-80%. Not for sea-level use: the nozzle is heavily over-expanded at 1 atm. Shares the H-1 model, so the long bell is not visually represented.
			specLevel = concept
			minThrust = 1203
			maxThrust = 1504
			ratedBurnTime = 320
			heatProduction = 100
			massMult = 1.28	//0.911 t H-1 base -> ~1166 kg: large vacuum bell + restart provisions (cf. LR87 49AR, SSME 150AR)
			throttleResponseRate = 0.6	//FADEC closed-loop

			%gimbalRange = 6	//upper-stage: less than the H-1 part's 10.5 (cf. RS-27's %gimbalRange override)

			ullage = True
			pressureFed = False
			ignitions = 3

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 1.0	//spark-torch igniter; no TEA-TEB slug
			}

			PROPELLANT
			{
				name = RP-1
				ratio = 0.3880
				DrawGauge = True
			}

			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.6120
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 323
				key = 1 195
			}

			//Concept engine, no flight history. Reliability seeded from H-2-250K like
			//the parent H1_Config.cfg does; restart capability lowers the effective
			//start-count risk only in-story, not in these numbers.
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 6000
				ratedBurnTime = 320
				safeOverburn = true
				ignitionReliabilityStart = 0.976829
				ignitionReliabilityEnd = 0.996341
				cycleReliabilityStart = 0.976829
				cycleReliabilityEnd = 0.996341
				techTransfer = S-3D,S-3:25&H-2-250K,H-1-250K,H-1-205K,H-1-200K,H-1-188K,H-1-165K:50
			}
		}
	}
}


//	----------------------------------------------------------------------------------
//	2) RP-1 career tech-tree gating.  No-ops without RP-1 (:NEEDS[RP-0]).
//	Node: orbitalRocketry1976 ("1976-1980") - upper-stage refinement, sits with the
//	real H-1-250K. entryCost / cost are rough estimates; tune to taste.
//	----------------------------------------------------------------------------------

@PART[*]:HAS[#engineType[H1]]:NEEDS[RP-0]:BEFORE[RealismOverhaulEnginesPost]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG[H-3-250K-V]
		{
			%techRequired = orbitalRocketry1976
			%entryCost = 21000
			%cost = 30
		}
	}
}
