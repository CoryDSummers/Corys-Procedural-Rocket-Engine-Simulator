//	==================================================================================
//	H-3-250K  —  fictional 1975 modernization of the H-2 250K   (booster / sustainer)
//
//	Manufacturer: Rocketdyne (fictional)
//
//	STANDALONE add-on patch. This is NOT part of RealismOverhaul — it lives in its own
//	folder so an RO update will not overwrite it. It appends one CONFIG (with one
//	SUBCONFIG) to the ModuleEngineConfigs that RO's H1_Config.cfg builds on the H-1
//	part, running :AFTER[RealismOverhaulEngines] so that module already exists.
//
//	Both configs here share the host H-1 3D model (BDB / FASA / KW / Squad). The
//	vacuum-optimized eps~40 upper-stage variant is a separate engine on a ROEngines
//	part — see H3-250K-V_Config.cfg.
//
//	=================================================================================
//	Design premise: the H-2 250K powerhead (enlarged tap-off-cycle turbopump,
//	simplified components) reworked with the best technology available in 1975.
//
//	 1. Channel-wall combustion chamber. Milled coolant slots in a NARloy-Z-class
//	    copper-alloy liner with an electroformed nickel close-out, replacing the H-1's
//	    brazed ~292-tube bundle. Lower gas-side wall temperature, higher chamber-
//	    pressure capability, an order of magnitude fewer braze joints  (-> item 4).
//	 2. Enlarged high-speed turbopump with a low-NPSH inducer. Raises chamber pressure
//	    ~4.52 -> ~6.2 MPa and cuts required tank pressurant. The higher Pc raises nozzle
//	    exit pressure for a given area ratio, which is what keeps the eps 12 / eps 16
//	    bells attached (or only mildly separated) at sea level.
//	 3. FADEC (full-authority digital engine control). Closed-loop thrust and mixture-
//	    ratio regulation, automated start / shutdown sequencing, redline health
//	    monitoring, throttle-command tracking. Enables the throttle band and tightens
//	    mixture-ratio residuals (less trapped propellant at cutoff).
//	 4. Consolidated parts count / fewer welds and joints -> lower unit cost.
//	 5. 100-80% throttle band. Max-Q thrust reduction and cluster thrust matching.
//	    Realised with a turbine-bypass / gas-generator-flow throttle valve under FADEC
//	    control; no injector redesign, so no deeper than ~80%.
//	 6. Expansion ratio raised for the solid-augmented sustainer role. Lift-off thrust
//	    is carried by the solid boosters, so mild sea-level over-expansion on the core
//	    is acceptable — the same rationale RO's own H1 %description gives for the real
//	    RS-27A on Delta II. eps~12 booster nozzle, eps~16 high-altitude sustainer nozzle.
//	 7. Qualified for 200 s continuous firing (vs ~155 s for any flown H-1). Duty-cycle
//	    drivers: RP-1 coking margin at the channel-wall coolant passages, turbine-wheel
//	    creep life, bearing DN life — all eased by the lower wall temperature and by
//	    running the enlarged turbopump well below its own redline.
//
//	=================================================================================
//	H-3-250K       [F]  eps 12, solid-augmented booster / sustainer
//
//	Dry Mass: ~929 kg
//	Thrust (SL):  ~1188 kN     ~267 klbf sl
//	Thrust (Vac): 1425 kN
//	ISP: 255 SL / 306 Vac
//	Burn Time: 200            rated continuous
//	Chamber Pressure: ~6.2 MPa
//	Propellant: LOX / RP-1
//	Prop Ratio: ~2.34
//	Throttle: 80 - 100%
//	Nozzle Ratio: 12
//	Ignitions: 1
//	Gimbal: 10.5             (inherited from the part)
//	---------------------------------------------------------------------------------
//	H-3-250K-16AR  [F]  eps 16, high-altitude sustainer   (shares the H-1 model)
//
//	Dry Mass: ~984 kg
//	Thrust (SL):  ~1169 kN     ~263 klbf sl  (mild lift-off over-expansion)
//	Thrust (Vac): 1444 kN
//	ISP: 251 SL / 310 Vac
//	Nozzle Ratio: 16          (all else as H-3-250K)
//
//	=================================================================================
//	Sources / derivation:
//	  Baseline and lineage: RealismOverhaul Engine_Configs/H1_Config.cfg
//	    (H-2-250K donor; RS-27 -> RS-27A used for the real eps 8 -> 12 Isp step).
//	  Expansion-ratio Isp deltas scaled from RealismOverhaul Engine_Configs/
//	    LR87_Config.cfg SUBCONFIG data (8AR / 12AR / 15AR / 49AR) and SSME_Config.cfg
//	    (35AR / 50AR / 150AR).
//	  [F] = fictional; this engine never existed.
//	==================================================================================

@PART[*]:HAS[#engineType[H1]]:NEEDS[RealismOverhaul&RealFuels]:AFTER[RealismOverhaulEngines]
{
	@MODULE[ModuleEngineConfigs]
	{
		CONFIG
		{
			name = H-3-250K
			description = Fictional 1975 modernization of the H-2 250K. Channel-wall copper chamber replaces the brazed tube bundle; an enlarged low-NPSH turbopump raises chamber pressure to ~6.2 MPa; a FADEC provides closed-loop thrust and mixture-ratio control, automated start/stop and redline monitoring. Throttles 100-80%. eps~12 nozzle for the solid-augmented booster role; rated for 200 s continuous. Subconfig 16AR swaps in an eps~16 high-altitude sustainer nozzle.
			specLevel = concept
			minThrust = 1140
			maxThrust = 1425
			ratedBurnTime = 200
			heatProduction = 100
			massMult = 1.02
			throttleResponseRate = 0.6	//FADEC closed-loop: ~1.7 s to slew the full 20% band

			ullage = True
			pressureFed = False
			ignitions = 1

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}

			IGNITOR_RESOURCE
			{
				name = TEATEB
				amount = 1
			}

			PROPELLANT
			{
				name = RP-1
				ratio = 0.3880
				DrawGauge = True
			}

			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.6120
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 306
				key = 1 255
			}

			SUBCONFIG
			{
				name = 16AR
				description = H-3-250K with an extended eps~16 nozzle optimized for the mid- and high-altitude sustain phase. Slightly lower sea-level thrust and mild lift-off over-expansion, offset by higher vacuum Isp; flown under solid-booster augmentation. Shares the H-1 model, so the longer bell is not visually represented.
				minThrust = 1155
				maxThrust = 1444
				costOffset = 30
				massMult = 1.08	//~1.06x the base nozzle mass (cf. the RS-27 -> RS-27A step)
				atmosphereCurve
				{
					key = 0 310
					key = 1 251
				}
			}

			//Concept engine, no flight history: reliability copied from H-2-250K, per
			//the parent file's own practice. The materials / FADEC gains are argued in
			//the description text, not by inventing reliability numbers.
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 5000	//simplified, de-rated enlarged pump, channel-wall chamber, FADEC redlines
				ratedBurnTime = 200
				safeOverburn = true
				ignitionReliabilityStart = 0.976829
				ignitionReliabilityEnd = 0.996341
				cycleReliabilityStart = 0.976829
				cycleReliabilityEnd = 0.996341
				techTransfer = S-3D,S-3:25&H-2-250K,H-1-250K,H-1-205K,H-1-200K,H-1-188K,H-1-165K:50
			}
		}
	}
}


//	----------------------------------------------------------------------------------
//	RP-1 career tech-tree gating.  No-ops without RP-1 installed (:NEEDS[RP-0]).
//	Mirrors the idiom of RP-1's own GameData/RP-1/Tree/TREE-Engines.cfg:
//	  %techRequired  - RealFuels reads it on the CONFIG; it auto-creates a
//	                   purchasable "RFUpgrade_H-3-250K" from techRequired + entryCost.
//	  %entryCost     - funds to unlock the config in R&D. RP-1 ECM discounts still apply.
//	  %cost          - recurring per-unit VAB cost delta when this config is picked.
//	Node choice: orbitalRocketry1972 ("1972-1975") - where the real RS-27 sits.
//	entryCost / cost are rough estimates for a ~1.4 MN kerolox engine; tune to taste.
//	----------------------------------------------------------------------------------
@PART[*]:HAS[#engineType[H1]]:NEEDS[RP-0]:BEFORE[RealismOverhaulEnginesPost]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG[H-3-250K]
		{
			%techRequired = orbitalRocketry1972
			%entryCost = 15000
			%cost = 20

			@SUBCONFIG[16AR]
			{
				%cost = 55
			}
		}
	}
}
