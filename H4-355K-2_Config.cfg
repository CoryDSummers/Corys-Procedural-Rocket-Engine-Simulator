//	==============================================================================
//	H4-355K-2  -  designed with engine_designer/ (fictional, unless you renamed it)
//
//	Propellant: LOX/RP-1   Mixture ratio: 2.20
//	Cycle: gas generator   Chamber Pressure: 16.00 MPa
//	Expansion ratio: 24.0   Nozzle: Bell (66% length, theta_n 31.0 / theta_e 12.1 deg)
//	Injector: Coaxial swirl / shear coaxial   Ignition: TEA-TEB pyrophoric slug
//	Contraction ratio: 2.45   L*: 1.84 m
//	Chamber material: Inconel 718 Nickel Superalloy (margin 1.16x @ Tc 3560 K)
//	Nozzle-extension material (past eps 6): Ablative Phenolic-Silica (margin 3.18x @ local T 1798 K)
//
//	Thrust (Vac): 1578.6 kN   Thrust (Vac, floor): 947.2 kN
//	ISP: 281.8 SL / 307.8 Vac
//	Throttle: 60 - 100%
//	mdot: 523.1 kg/s
//	Estimated dry mass: 2065.4 kg (chamber/nozzle wall 1446.4 kg + turbopump 554.3 kg + injector plate 59.4 kg + stability aids 5.2 kg - a LOWER BOUND, see physics/mass_model.py: no valves/actuators/mounting structure)
//	Rated / tested burn time: 202 / 2828 s
//
//	Turbopump: single shaft, 1x pressure compounded 2stage turbine, 2-stage fuel pump 20192 rpm / 1-stage ox pump 19754 rpm, Inconel 718 (nickel superalloy)
//	  derived efficiency: fuel pump 0.742, ox pump 0.774, turbine 0.760 (overall 0.576); assembly ~1.46x0.71 m, ~554 kg; peak tip speed 181 m/s (feasible)
//
//	Cycle detail: gas-generator bleed 5.0% (26.1 kg/s) dumped overboard
//
//	WARNINGS from the design tool (review before using in a career save):
//	  - Coaxial swirl / shear coaxial is unusual for LOX/RP-1; it's typically used for LOX/LH2. Efficiency numbers may be optimistic.
//
//	massMult = 1.656 (host part's stock mass x this multiplier). Estimated from the design physics above vs. the host part.
//	==============================================================================

@PART[*]:HAS[#engineType[NK33]]:NEEDS[RealismOverhaul&RealFuels]:AFTER[RealismOverhaulEngines]
{
	@MODULE[ModuleEngineConfigs]
	{
		CONFIG
		{
			name = H4-355K-2
			description = Custom engine designed with engine_designer/. LOX/RP-1 gas generator, Coaxial swirl / shear coaxial injector, TEA-TEB pyrophoric slug ignition, Pc 16.00 MPa, bell (66% length, theta_n 31.0 / theta_e 12.1 deg) nozzle, throttles 60-100%.
			specLevel = concept
			minThrust = 947.18
			maxThrust = 1578.64
			ratedBurnTime = 202
			heatProduction = 100
			massMult = 1.6562891194911102
			throttleResponseRate = 0.6
			varyIsp = 0.008
			varyMixture = 0.004
			residualsThresholdBase = 0.008
			pressureFed = False
			ullage = True
			ignitions = 1

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
			IGNITOR_RESOURCE
			{
				name = TEATEB
				amount = 1
			}

			PROPELLANT
			{
				name = RP-1
				ratio = 0.3904
				DrawGauge = True
			}

			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.6096
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 307.8
				key = 1 281.8
			}

			useThrottleIspCurve = true
			throttleIspCurve
			{
				key = 0.00 0.001 0 0
				key = 0.70 0.001 0 0	//separation onset from the design's throttle sweep
				key = 0.85 0.85  0 0
				key = 1.00 1.00  0 0
			}
			throttleIspCurveAtmStrength
			{
				key = 0.0 0.02
				key = 1.0 1.0
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 2828
				ratedBurnTime = 202
				safeOverburn = true
				ignitionReliabilityStart = 0.980000
				ignitionReliabilityEnd = 0.997000
				cycleReliabilityStart = 0.980000
				cycleReliabilityEnd = 0.997000
			}
		}
	}
}


//	------------------------------------------------------------------------------
//	RP-1 career tech-tree gating.  No-ops without RP-1 installed (:NEEDS[RP-0]).
//	entryCost / cost supplied via the design tool - tune to taste.
//	------------------------------------------------------------------------------
@PART[*]:HAS[#engineType[NK33]]:NEEDS[RP-0]:BEFORE[RealismOverhaulEnginesPost]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG[H4-355K-2]
		{
			%techRequired = orbitalRocketry1976
			%entryCost = 10000.0
			%cost = 20.0
		}
	}
}
